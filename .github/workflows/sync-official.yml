name: Sync official holiday notices
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-official.yml'
      - 'scripts/sync_official.py'
      - 'tests/test_sync_official.py'
      - 'tests/fixtures/**'
permissions:
  contents: write
concurrency:
  group: holiday-data-update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing data and updater
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/manage.py check
      - name: Check official notices
        run: python3 scripts/sync_official.py --report /tmp/holiday-sync-report.json
      - name: Validate generated changes before publishing
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/manage.py check
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-sync-report
          path: |
            /tmp/holiday-sync-report.json
            automation/reviews/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish validated data or review records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plans years index.json automation
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sync official holiday notices and monitor health'
          git push origin HEAD:main
